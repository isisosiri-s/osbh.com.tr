# Astro sitesini build edip FTP ile cPanel hostingine deploy eder.
# Gerekli GitHub repo secret'ları (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    cPanel FTP sunucu adresi (örn. mt-pegasus.guzelhosting.com)
#   FTP_USERNAME  FTP kullanıcı adı (osbh.com.tr için oluşturulan özel FTP hesabı)
#   FTP_PASSWORD  FTP şifresi
name: Deploy to cPanel (FTP)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "cpanel-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./site/dist/
          server-dir: ./
